name: Publish OTA Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Release tag, for example v1.0.0
        required: true
        type: string
      release_name:
        description: Optional release name override
        required: false
        type: string
      draft:
        description: Create the release as a draft
        required: true
        default: false
        type: boolean
      prerelease:
        description: Mark the release as a prerelease
        required: true
        default: false
        type: boolean

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            version="${{ inputs.version }}"
            release_name="${{ inputs.release_name }}"
            draft="${{ inputs.draft }}"
            prerelease="${{ inputs.prerelease }}"
          else
            version="${GITHUB_REF_NAME}"
            release_name=""
            draft="false"
            prerelease="false"
          fi

          if [[ -z "${release_name}" ]]; then
            release_name="${version}"
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "release_name=${release_name}" >> "$GITHUB_OUTPUT"
          echo "draft=${draft}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${prerelease}" >> "$GITHUB_OUTPUT"

          notes_file="release-notes/${version}.md"
          if [[ -f "$notes_file" ]]; then
            echo "body_path=${notes_file}" >> "$GITHUB_OUTPUT"
          else
            temp_notes="$(mktemp)"
            printf "Encrypted OTA firmware release %s\n" "$version" > "$temp_notes"
            echo "body_path=${temp_notes}" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate release assets
        shell: bash
        run: |
          version="${{ steps.meta.outputs.version }}"
          asset_dir="packages/${version}"

          [[ -d "$asset_dir" ]] || {
            echo "Expected asset directory not found: $asset_dir"
            exit 1
          }

          compgen -G "$asset_dir/*.ota" > /dev/null || {
            echo "No .ota files found in $asset_dir"
            exit 1
          }

          find "$asset_dir" -maxdepth 1 -type f | sort

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.version }}
          name: ${{ steps.meta.outputs.release_name }}
          body_path: ${{ steps.meta.outputs.body_path }}
          draft: ${{ steps.meta.outputs.draft }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          files: |
          packages/${{ steps.meta.outputs.version }}/*
