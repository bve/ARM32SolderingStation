    # Public OTA Release Repo

    The public encrypted firmware repository is:

    - `bve/ARM32SolderingStation`

    ## Release Layout

    Each firmware version is published as one GitHub Release tag and one matching directory in the public repo:

    ```text
    packages/
      v1.2.3/
      ARM32SolderingStation-board_v1-v1.2.3.ota
      ARM32SolderingStation-board_v2-v1.2.3.ota
      SHA256SUMS.txt
    release-notes/
      v1.2.3.md
    ```

    ## Naming Convention

    - Release tag: `v<app-version>`
    - Board v1 asset: `ARM32SolderingStation-board_v1-v<app-version>.ota`
    - Board v2 asset: `ARM32SolderingStation-board_v2-v<app-version>.ota`

    The ESP32-C3 sidecar now filters release assets by `boardRevision`, so both board packages are expected to be attached to the same GitHub Release.

    ## Publish Flow

    From the private source repository:

    ```bash
    python3 tools/publish_public_ota_release.py --version 1.2.3
    ```

    The helper script:

    1. builds encrypted OTA packages for `board_v1_app` and `board_v2_app`;
    2. copies them into the sibling public repo;
    3. writes `SHA256SUMS.txt` and release notes;
    4. commits the public repo changes;
    5. creates tag `v1.2.3`;
    6. pushes branch and tag to GitHub.

    The public repo GitHub Actions workflow then publishes the GitHub Release automatically.
